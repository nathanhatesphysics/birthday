<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>happy birthday alyssa</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #fff;
      color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 300;
    }

    section {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      transition: opacity 0.6s ease;
    }

    #line {
      font-size: clamp(1.25rem, 4vw, 2rem);
      line-height: 1.4;
      max-width: 32ch;
      min-height: 2.8em;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    #line.show {
      opacity: 1;
      transform: translateY(0);
    }

    #line.leave {
      opacity: 0;
      transform: translateY(-8px);
    }

    .intro-buttons {
      display: flex;
      gap: 0.75rem;
      margin-top: 2.5rem;
    }

    #prev, #next {
      background: transparent;
      color: #000;
      border: 1px solid #000;
      padding: 0.6rem 1.6rem;
      font: inherit;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: background 0.25s ease, color 0.25s ease;
    }

    #prev { transition: background 0.25s ease, color 0.25s ease, opacity 0.4s ease; }
    #prev.off { opacity: 0; pointer-events: none; }

    #skip {
      position: absolute;
      top: 1.25rem;
      right: 1.5rem;
      background: none;
      border: none;
      color: #999;
      font: inherit;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: color 0.25s ease;
    }

    #skip:hover { color: #000; }

    #prev:hover, #next:hover {
      background: #000;
      color: #fff;
    }

    .hidden { display: none !important; }
    .faded { opacity: 0; }

    /* main site — white with pastel shapes + yoshi */
    :root {
      --pink: #ffd6e0;
      --blue: #cfe6ff;
      --green: #d6f2cf;
      --yellow: #fff0b3;
      --lavender: #e4dcff;
      --peach: #ffdfc8;
    }

    #decor {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    .shape, .pic {
      position: absolute;
      animation: float 9s ease-in-out infinite;
      animation-delay: var(--d, 0s);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); }
      50% { transform: translateY(-12px) rotate(calc(var(--r, 0deg) + 4deg)); }
    }

    .circle { border-radius: 50%; }
    .blob { border-radius: 62% 38% 46% 54% / 58% 44% 56% 42%; }
    .square { border-radius: 22%; }
    .ring { border-radius: 50%; border: 10px solid; background: none !important; }
    .triangle { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
    .bar { border-radius: 999px; }

    .pic {
      object-fit: cover;
      object-position: 50% 40%;
    }

    .page {
      position: relative;
      z-index: 1;
    }

    .center-wrap {
      position: relative;
      width: clamp(240px, 48vw, 400px);
      aspect-ratio: 1;
    }

    .center-wrap::before {
      content: "";
      position: absolute;
      inset: -6% -10% -10% -6%;
      background: var(--pink);
      border-radius: 62% 38% 46% 54% / 58% 44% 56% 42%;
      z-index: -1;
    }

    .centerpiece {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: 50% 45%;
    }

    .page h1 {
      margin-top: 2.25rem;
      font-weight: 600;
      font-size: clamp(2rem, 6vw, 3.75rem);
      letter-spacing: -0.02em;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-top: 2rem;
    }

    .pill {
      background: #fff;
      color: #000;
      border: 1px solid #000;
      border-radius: 999px;
      font: inherit;
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      padding: 0.7rem 2rem;
      cursor: pointer;
      transition: background 0.25s ease, transform 0.25s ease;
    }

    .pill[data-go="messages"]:hover { background: var(--yellow); }
    .pill:hover { transform: translateY(-2px); }
    .back:hover { background: var(--lavender); }

    .back {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      padding: 0.5rem 1.4rem;
      font-size: 0.85rem;
    }

    /* messages board */
    #messages {
      justify-content: flex-start;
      padding-top: 5rem;
    }

    .add-btn { margin-top: 1.25rem; }
    .add-btn:hover { background: var(--pink); }

    .board {
      width: 100%;
      max-width: 1100px;
      margin-top: 2.5rem;
      columns: 4 240px;
      column-gap: 1.25rem;
      text-align: left;
    }

    .card {
      break-inside: avoid;
      margin-bottom: 1.25rem;
      padding: 1rem 1rem 1.1rem;
      border-radius: 18px;
      background: var(--c);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      transform: rotate(var(--r));
      transition: transform 0.25s ease;
      animation: fadein 0.5s ease both;
    }

    .card:hover { transform: rotate(0deg) translateY(-3px); }

    .card img {
      display: block;
      width: 100%;
      border-radius: 12px;
      margin-bottom: 0.85rem;
    }

    .card p {
      font-size: 1rem;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .card .from {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .board-note {
      margin-top: 3rem;
      color: #888;
    }

    @keyframes fadein {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* add-a-message popup */
    #composer {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: opacity 0.3s ease;
    }

    #composer form {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid #000;
      border-radius: 22px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      text-align: left;
    }

    #composer h2 {
      font-weight: 600;
      font-size: 1.4rem;
    }

    #composer input[type="text"], #composer textarea {
      width: 100%;
      font: inherit;
      font-size: 1rem;
      padding: 0.7rem 0.9rem;
      border: 1px solid #ccc;
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    #composer input[type="text"]:focus, #composer textarea:focus { border-color: #000; }
    #composer textarea { min-height: 120px; resize: vertical; }

    .photo-pick {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.9rem;
      color: #666;
      cursor: pointer;
    }

    .photo-pick input { display: none; }

    .photo-pick span {
      border: 1px dashed #999;
      border-radius: 999px;
      padding: 0.45rem 1rem;
    }

    #preview {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 12px;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
    }

    #post:hover { background: var(--green); }
    #post:disabled { opacity: 0.5; cursor: wait; }

    #form-error {
      color: #c0392b;
      font-size: 0.9rem;
    }

    @media (max-width: 700px) {
      .desktop-only { display: none; }
    }
  </style>
</head>
<body>
  <section id="intro">
    <button id="skip">skip</button>
    <p id="line"></p>
    <div class="intro-buttons">
      <button id="prev" class="off">back</button>
      <button id="next">next</button>
    </div>
  </section>

  <div id="decor" class="hidden faded" aria-hidden="true">
    <div class="shape blob" style="top:-6%; left:-5%; width:260px; height:240px; background:var(--lavender); --r:-8deg"></div>
    <img class="pic circle" src="images/img_2433.jpg" alt="" style="top:5%; left:4%; width:170px; height:170px; --d:-1s">
    <div class="shape circle" style="top:30%; left:14%; width:34px; height:34px; background:var(--yellow); --d:-2s"></div>
    <div class="shape triangle desktop-only" style="top:40%; left:3%; width:70px; height:62px; background:var(--green); --r:12deg; --d:-3s"></div>
    <div class="shape square" style="top:4%; right:16%; width:90px; height:90px; background:var(--peach); --r:18deg; --d:-4s"></div>
    <img class="pic blob" src="images/img_3117.jpg" alt="" style="top:8%; right:3%; width:190px; height:200px; --d:-2.5s">
    <div class="shape ring" style="top:32%; right:14%; width:64px; height:64px; border-color:var(--pink); --d:-5s"></div>
    <img class="pic square desktop-only" src="images/img_2426.jpg" alt="" style="top:46%; left:7%; width:150px; height:150px; --r:-6deg; --d:-3.5s">
    <img class="pic circle desktop-only" src="images/img_2440.jpg" alt="" style="top:44%; right:6%; width:160px; height:160px; --d:-1.5s">
    <div class="shape bar desktop-only" style="top:58%; right:20%; width:110px; height:26px; background:var(--blue); --r:-20deg; --d:-6s"></div>
    <div class="shape blob" style="bottom:-8%; right:-6%; width:300px; height:260px; background:var(--green); --r:10deg; --d:-2s"></div>
    <img class="pic blob" src="images/img_2421.jpg" alt="" style="bottom:4%; right:6%; width:180px; height:170px; --d:-4.5s">
    <div class="shape circle" style="bottom:-5%; left:-4%; width:220px; height:220px; background:var(--blue); --d:-3s"></div>
    <img class="pic circle" src="images/img_3116.jpg" alt="" style="bottom:5%; left:5%; width:150px; height:150px; --d:-0.5s">
    <div class="shape triangle" style="bottom:24%; left:20%; width:56px; height:50px; background:var(--pink); --r:-15deg; --d:-5.5s"></div>
    <img class="pic square desktop-only" src="images/img_2423.jpg" alt="" style="bottom:3%; left:28%; width:120px; height:120px; --r:8deg; --d:-2.2s">
    <div class="shape circle desktop-only" style="bottom:12%; right:30%; width:28px; height:28px; background:var(--lavender); --d:-1.2s"></div>
    <img class="pic circle desktop-only" src="images/img_2422.jpg" alt="" style="bottom:6%; right:24%; width:110px; height:110px; --d:-3.8s">
  </div>

  <section id="site" class="page hidden faded">
    <div class="center-wrap">
      <img class="centerpiece" src="images/img_2980.jpg" alt="yoshi up close">
    </div>
    <h1>happy birthday alyssa</h1>
    <div class="buttons">
      <button class="pill" data-go="messages">messages</button>
    </div>
  </section>

  <section id="messages" class="page hidden faded">
    <button class="pill back" data-go="site">&larr; back</button>
    <h1>messages</h1>
    <button class="pill add-btn" id="open-composer">+ add a message</button>
    <div class="board" id="board"></div>
    <p class="board-note hidden" id="board-note"></p>
  </section>

  <div id="composer" class="hidden faded">
    <form id="message-form">
      <h2>leave alyssa a message</h2>
      <input type="text" id="msg-name" placeholder="your name" maxlength="60" required>
      <textarea id="msg-text" placeholder="write something nice..." maxlength="1000" required></textarea>
      <label class="photo-pick">
        <input type="file" id="msg-photo" accept="image/*">
        <span>+ add a photo</span>
        <small id="photo-name">optional</small>
      </label>
      <img id="preview" class="hidden" alt="">
      <p id="form-error" class="hidden"></p>
      <div class="form-actions">
        <button type="button" class="pill" id="cancel">cancel</button>
        <button type="submit" class="pill" id="post">post</button>
      </div>
    </form>
  </div>

  <script>
    const lines = [
      "hi alyssa",
      "so i got a bit bored studying for my midterm",
      "and i had some leftover claude tokens",
      "so i thought what better way to spend them",
      "than a vibecoded ai slop website",
      "without further ado",
      "here is my shitty excuse of a birthday card",
    ];

    const intro = document.getElementById("intro");
    const site = document.getElementById("site");
    const line = document.getElementById("line");
    const next = document.getElementById("next");
    const prev = document.getElementById("prev");
    const skip = document.getElementById("skip");
    const decor = document.getElementById("decor");

    let i = 0;
    let busy = false;
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

    async function showLine() {
      line.textContent = lines[i];
      prev.classList.toggle("off", i === 0);
      line.classList.remove("leave");
      await wait(20);
      line.classList.add("show");
    }

    async function step(dir) {
      if (busy) return;
      if (dir < 0 && i === 0) return;
      busy = true;

      line.classList.remove("show");
      line.classList.add("leave");
      await wait(400);

      i += dir;
      if (i < lines.length) {
        await showLine();
        await wait(400);
      } else {
        await finishIntro();
      }

      busy = false;
    }

    async function finishIntro() {
      intro.classList.add("faded");
      await wait(600);
      intro.classList.add("hidden");
      site.classList.remove("hidden");
      decor.classList.remove("hidden");
      await wait(20);
      site.classList.remove("faded");
      decor.classList.remove("faded");
      document.removeEventListener("keydown", onKey);
    }

    async function skipIntro() {
      if (busy) return;
      busy = true;
      await finishIntro();
      busy = false;
    }

    function onKey(e) {
      if (["Enter", " ", "ArrowRight"].includes(e.key)) {
        e.preventDefault();
        step(1);
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        step(-1);
      }
    }

    let current = site;

    async function go(id) {
      const target = document.getElementById(id);
      if (busy || target === current) return;
      busy = true;
      current.classList.add("faded");
      await wait(600);
      current.classList.add("hidden");
      target.classList.remove("hidden");
      window.scrollTo(0, 0);
      await wait(20);
      target.classList.remove("faded");
      current = target;
      busy = false;
    }

    // ---- messages board (Supabase) ----
    const SUPABASE_URL = "https://duflaulmvwqoqnrffksv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_TnAW3Tj_1ya9YFgc0Mv-Kw_S-lZUCbX";
    const PHOTO_PREFIX = `${SUPABASE_URL}/storage/v1/object/public/photos/`;
    const COLORS = ["--pink", "--blue", "--green", "--yellow", "--lavender", "--peach"];

    const board = document.getElementById("board");
    const boardNote = document.getElementById("board-note");
    const composer = document.getElementById("composer");
    const form = document.getElementById("message-form");
    const nameInput = document.getElementById("msg-name");
    const textInput = document.getElementById("msg-text");
    const photoInput = document.getElementById("msg-photo");
    const photoName = document.getElementById("photo-name");
    const preview = document.getElementById("preview");
    const formError = document.getElementById("form-error");
    const postBtn = document.getElementById("post");

    // stable per-message color/tilt, derived from its id
    function hash(str) {
      let h = 0;
      for (const ch of str) h = (h * 31 + ch.charCodeAt(0)) | 0;
      return Math.abs(h);
    }

    function renderCard(msg) {
      const card = document.createElement("article");
      const h = hash(msg.id);
      card.className = "card";
      card.style.setProperty("--c", `var(${COLORS[h % COLORS.length]})`);
      card.style.setProperty("--r", `${(h % 5) - 2}deg`);

      // only show images that live in our own photos bucket
      if (msg.image_url && msg.image_url.startsWith(PHOTO_PREFIX)) {
        const img = document.createElement("img");
        img.src = msg.image_url;
        img.alt = "";
        img.loading = "lazy";
        card.append(img);
      }

      const text = document.createElement("p");
      text.textContent = msg.text;
      const from = document.createElement("p");
      from.className = "from";
      from.textContent = `— ${msg.name}`;
      card.append(text, from);
      return card;
    }

    function setNote(text) {
      boardNote.textContent = text;
      boardNote.classList.toggle("hidden", !text);
    }

    async function loadMessages() {
      setNote(board.children.length ? "" : "loading...");
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/messages?select=*&order=created_at.desc`, {
          headers: { apikey: SUPABASE_KEY },
        });
        if (!res.ok) throw new Error(res.status);
        const messages = await res.json();
        board.replaceChildren(...messages.map(renderCard));
        setNote(messages.length ? "" : "no messages yet, be the first!");
      } catch {
        setNote("couldn't load messages, try refreshing");
      }
    }

    // shrink to max 1200px and re-encode as JPEG, which also strips location data
    function shrinkImage(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, 1200 / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(img.src);
          canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error("encode"))), "image/jpeg", 0.85);
        };
        img.onerror = () => reject(new Error("unreadable"));
        img.src = URL.createObjectURL(file);
      });
    }

    async function uploadPhoto(file) {
      const blob = await shrinkImage(file);
      const path = `${Date.now()}-${crypto.randomUUID()}.jpg`;
      const res = await fetch(`${SUPABASE_URL}/storage/v1/object/photos/${path}`, {
        method: "POST",
        headers: { apikey: SUPABASE_KEY, "Content-Type": "image/jpeg" },
        body: blob,
      });
      if (!res.ok) throw new Error("upload");
      return PHOTO_PREFIX + path;
    }

    function showError(text) {
      formError.textContent = text;
      formError.classList.toggle("hidden", !text);
    }

    async function openComposer() {
      composer.classList.remove("hidden");
      await wait(20);
      composer.classList.remove("faded");
      nameInput.focus();
    }

    async function closeComposer() {
      composer.classList.add("faded");
      await wait(300);
      composer.classList.add("hidden");
      form.reset();
      preview.classList.add("hidden");
      photoName.textContent = "optional";
      showError("");
    }

    photoInput.addEventListener("change", () => {
      const file = photoInput.files[0];
      if (!file) return;
      if (file.size > 15 * 1024 * 1024) {
        showError("that photo is too big (max 15MB)");
        photoInput.value = "";
        return;
      }
      showError("");
      photoName.textContent = file.name;
      preview.src = URL.createObjectURL(file);
      preview.classList.remove("hidden");
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      const text = textInput.value.trim();
      if (!name || !text) return showError("add your name and a message");

      postBtn.disabled = true;
      postBtn.textContent = "posting...";
      showError("");
      try {
        const file = photoInput.files[0];
        const image_url = file ? await uploadPhoto(file) : null;
        const res = await fetch(`${SUPABASE_URL}/rest/v1/messages`, {
          method: "POST",
          headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json", Prefer: "return=minimal" },
          body: JSON.stringify({ name, text, image_url }),
        });
        if (!res.ok) throw new Error("post");
        await closeComposer();
        await loadMessages();
      } catch {
        showError("something went wrong, try again");
      } finally {
        postBtn.disabled = false;
        postBtn.textContent = "post";
      }
    });

    document.getElementById("open-composer").addEventListener("click", openComposer);
    document.getElementById("cancel").addEventListener("click", closeComposer);
    composer.addEventListener("click", (e) => { if (e.target === composer) closeComposer(); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !composer.classList.contains("hidden")) closeComposer();
    });

    document.querySelectorAll("[data-go]").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (btn.dataset.go === "messages") loadMessages();
        go(btn.dataset.go);
      });
    });

    next.addEventListener("click", () => step(1));
    prev.addEventListener("click", () => step(-1));
    skip.addEventListener("click", skipIntro);
    document.addEventListener("keydown", onKey);
    showLine();
  </script>
</body>
</html>
