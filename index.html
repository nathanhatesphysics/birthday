<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>happy birthday alyssa</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #fff;
      color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 300;
    }

    section {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      transition: opacity 0.6s ease;
    }

    #line {
      font-size: clamp(1.25rem, 4vw, 2rem);
      line-height: 1.4;
      max-width: 32ch;
      min-height: 2.8em;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    #line.show {
      opacity: 1;
      transform: translateY(0);
    }

    #line.leave {
      opacity: 0;
      transform: translateY(-8px);
    }

    #next {
      margin-top: 2.5rem;
      background: transparent;
      color: #000;
      border: 1px solid #000;
      padding: 0.6rem 1.6rem;
      font: inherit;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: background 0.25s ease, color 0.25s ease;
    }

    #next:hover {
      background: #000;
      color: #fff;
    }

    .hidden { display: none; }
    .faded { opacity: 0; }

    /* main site — themed around yoshi */
    :root { --gold: #c98a3e; --cream: #fbf6ee; }

    #site {
      justify-content: flex-start;
      padding-top: 4rem;
      background: linear-gradient(to bottom, var(--cream), #fff 60%);
    }

    .hero {
      width: clamp(160px, 40vw, 240px);
      aspect-ratio: 1;
      border-radius: 50%;
      object-fit: cover;
      object-position: 50% 40%;
      border: 3px solid var(--gold);
      box-shadow: 0 10px 30px rgba(201, 138, 62, 0.25);
    }

    #site h1 {
      margin-top: 1.75rem;
      font-weight: 300;
      font-size: clamp(2rem, 6vw, 3.5rem);
    }

    .sub {
      margin-top: 0.5rem;
      color: var(--gold);
      letter-spacing: 0.15em;
      font-size: 0.85rem;
    }

    .faces {
      display: flex;
      gap: 0.6rem;
      margin-top: 1.75rem;
    }

    .faces img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      object-position: 50% 35%;
      border: 1px solid var(--gold);
      transition: transform 0.25s ease;
    }

    .faces img:hover { transform: translateY(-3px) rotate(-4deg); }

    .tabs {
      display: flex;
      gap: 2rem;
      margin-top: 3rem;
      border-bottom: 1px solid #e8e1d6;
    }

    .tab {
      background: none;
      border: none;
      font: inherit;
      font-size: 0.95rem;
      letter-spacing: 0.15em;
      color: #999;
      padding: 0.6rem 0.25rem;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.25s ease, border-color 0.25s ease;
    }

    .tab:hover { color: #000; }
    .tab.active { color: #000; border-bottom-color: var(--gold); }

    .panel {
      width: 100%;
      max-width: 720px;
      min-height: 40vh;
      padding: 2rem 0;
      animation: fadein 0.4s ease;
    }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <section id="intro">
    <p id="line"></p>
    <button id="next">next</button>
  </section>

  <section id="site" class="hidden faded">
    <img class="hero" src="images/img_2980.jpg" alt="yoshi up close">
    <h1>happy birthday alyssa</h1>
    <p class="sub">from me &amp; yoshi</p>

    <div class="faces">
      <img src="images/img_2433.jpg" alt="yoshi">
      <img src="images/img_2440.jpg" alt="yoshi">
      <img src="images/img_3116.jpg" alt="yoshi">
      <img src="images/img_2421.jpg" alt="yoshi">
      <img src="images/img_2426.jpg" alt="yoshi">
    </div>

    <nav class="tabs">
      <button class="tab active" data-tab="pictures">pictures</button>
      <button class="tab" data-tab="messages">messages</button>
    </nav>

    <div class="panel" id="pictures"></div>
    <div class="panel hidden" id="messages"></div>
  </section>

  <script>
    const lines = [
      "hi alyssa",
      "so i got a bit bored studying for my midterm",
      "and i had some leftover claude tokens",
      "so i thought what better way to spend them",
      "than a vibecoded ai slop website",
      "without further ado",
      "here is my shitty excuse of a birthday card",
    ];

    const intro = document.getElementById("intro");
    const site = document.getElementById("site");
    const line = document.getElementById("line");
    const next = document.getElementById("next");

    let i = 0;
    let busy = false;
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

    async function showLine() {
      line.textContent = lines[i];
      line.classList.remove("leave");
      await wait(20);
      line.classList.add("show");
    }

    async function advance() {
      if (busy) return;
      busy = true;

      line.classList.remove("show");
      line.classList.add("leave");
      await wait(400);

      i++;
      if (i < lines.length) {
        await showLine();
        await wait(400);
      } else {
        intro.classList.add("faded");
        await wait(600);
        intro.classList.add("hidden");
        site.classList.remove("hidden");
        await wait(20);
        site.classList.remove("faded");
        document.removeEventListener("keydown", onKey);
      }

      busy = false;
    }

    function onKey(e) {
      if (["Enter", " ", "ArrowRight"].includes(e.key)) {
        e.preventDefault();
        advance();
      }
    }

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t === tab));
        document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("hidden", p.id !== tab.dataset.tab));
      });
    });

    next.addEventListener("click", advance);
    document.addEventListener("keydown", onKey);
    showLine();
  </script>
</body>
</html>
