<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>happy birthday alyssa</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #fff;
      color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 300;
    }

    section {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      transition: opacity 0.6s ease;
    }

    #line {
      font-size: clamp(1.25rem, 4vw, 2rem);
      line-height: 1.4;
      max-width: 32ch;
      min-height: 2.8em;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    #line.show {
      opacity: 1;
      transform: translateY(0);
    }

    #line.leave {
      opacity: 0;
      transform: translateY(-8px);
    }

    #next {
      margin-top: 2.5rem;
      background: transparent;
      color: #000;
      border: 1px solid #000;
      padding: 0.6rem 1.6rem;
      font: inherit;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: background 0.25s ease, color 0.25s ease;
    }

    #next:hover {
      background: #000;
      color: #fff;
    }

    .hidden { display: none; }
    .faded { opacity: 0; }

    /* main site — egregious yoshi mode */
    :root { --bg: #ff4fa3; --gold: #ffb703; }

    .page {
      position: relative;
      overflow: hidden;
      background: var(--bg);
      color: #fff;
    }

    .page h1 {
      position: relative;
      z-index: 10;
      font-weight: 900;
      font-size: clamp(3rem, 11vw, 8rem);
      line-height: 0.95;
      letter-spacing: -0.03em;
      text-shadow: 4px 4px 0 #000;
      -webkit-text-stroke: 2px #000;
    }

    .scatter {
      position: absolute;
      width: clamp(150px, 24vw, 330px);
      border: 10px solid #fff;
      border-bottom-width: 36px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
      transform: rotate(var(--r));
      animation: bob 3.5s ease-in-out infinite;
      animation-delay: var(--d);
      transition: transform 0.25s ease;
      z-index: 1;
    }

    .scatter:hover {
      animation-play-state: paused;
      transform: rotate(0deg) scale(1.15);
      z-index: 20;
    }

    @keyframes bob {
      0%, 100% { transform: rotate(var(--r)) translateY(0); }
      50% { transform: rotate(calc(var(--r) * -0.5)) translateY(-14px); }
    }

    .buttons {
      position: relative;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.25rem;
      margin-top: 2.5rem;
    }

    .big-btn {
      background: #fff;
      color: #000;
      border: 3px solid #000;
      box-shadow: 6px 6px 0 #000;
      font: inherit;
      font-weight: 800;
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      letter-spacing: 0.05em;
      padding: 0.9rem 2.2rem;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s ease;
    }

    .big-btn:hover { background: var(--gold); }
    .big-btn:active { transform: translate(6px, 6px); box-shadow: 0 0 0 #000; }

    .back {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      z-index: 10;
      font-size: 1rem;
      padding: 0.5rem 1.2rem;
      box-shadow: 4px 4px 0 #000;
    }
  </style>
</head>
<body>
  <section id="intro">
    <p id="line"></p>
    <button id="next">next</button>
  </section>

  <section id="site" class="page hidden faded">
    <img class="scatter" src="images/img_2980.jpg" alt="yoshi" style="top:-3%; left:-2%; --r:-9deg; --d:0s">
    <img class="scatter" src="images/img_2433.jpg" alt="yoshi" style="top:2%; right:-3%; --r:11deg; --d:-0.7s">
    <img class="scatter" src="images/img_3117.jpg" alt="yoshi" style="top:-12%; left:37%; --r:4deg; --d:-1.4s">
    <img class="scatter" src="images/img_2421.jpg" alt="yoshi" style="top:36%; left:-7%; --r:14deg; --d:-2.1s">
    <img class="scatter" src="images/img_2426.jpg" alt="yoshi" style="top:34%; right:-6%; --r:-12deg; --d:-2.8s">
    <img class="scatter" src="images/img_3116.jpg" alt="yoshi" style="bottom:-6%; left:3%; --r:7deg; --d:-0.35s">
    <img class="scatter" src="images/img_2423.jpg" alt="yoshi" style="bottom:-16%; left:39%; --r:-5deg; --d:-1.05s">
    <img class="scatter" src="images/img_2440.jpg" alt="yoshi" style="bottom:-5%; right:2%; --r:-8deg; --d:-1.75s">

    <h1>happy<br>birthday<br>alyssa</h1>

    <div class="buttons">
      <button class="big-btn" data-go="pictures">pictures</button>
      <button class="big-btn" data-go="messages">messages</button>
    </div>
  </section>

  <section id="pictures" class="page hidden faded">
    <button class="big-btn back" data-go="site">&larr; back</button>
    <h1>pictures</h1>
  </section>

  <section id="messages" class="page hidden faded">
    <button class="big-btn back" data-go="site">&larr; back</button>
    <h1>messages</h1>
  </section>

  <script>
    const lines = [
      "hi alyssa",
      "so i got a bit bored studying for my midterm",
      "and i had some leftover claude tokens",
      "so i thought what better way to spend them",
      "than a vibecoded ai slop website",
      "without further ado",
      "here is my shitty excuse of a birthday card",
    ];

    const intro = document.getElementById("intro");
    const site = document.getElementById("site");
    const line = document.getElementById("line");
    const next = document.getElementById("next");

    let i = 0;
    let busy = false;
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

    async function showLine() {
      line.textContent = lines[i];
      line.classList.remove("leave");
      await wait(20);
      line.classList.add("show");
    }

    async function advance() {
      if (busy) return;
      busy = true;

      line.classList.remove("show");
      line.classList.add("leave");
      await wait(400);

      i++;
      if (i < lines.length) {
        await showLine();
        await wait(400);
      } else {
        intro.classList.add("faded");
        await wait(600);
        intro.classList.add("hidden");
        site.classList.remove("hidden");
        await wait(20);
        site.classList.remove("faded");
        document.removeEventListener("keydown", onKey);
      }

      busy = false;
    }

    function onKey(e) {
      if (["Enter", " ", "ArrowRight"].includes(e.key)) {
        e.preventDefault();
        advance();
      }
    }

    let current = site;

    async function go(id) {
      const target = document.getElementById(id);
      if (busy || target === current) return;
      busy = true;
      current.classList.add("faded");
      await wait(600);
      current.classList.add("hidden");
      target.classList.remove("hidden");
      window.scrollTo(0, 0);
      await wait(20);
      target.classList.remove("faded");
      current = target;
      busy = false;
    }

    document.querySelectorAll("[data-go]").forEach((btn) => {
      btn.addEventListener("click", () => go(btn.dataset.go));
    });

    next.addEventListener("click", advance);
    document.addEventListener("keydown", onKey);
    showLine();
  </script>
</body>
</html>
