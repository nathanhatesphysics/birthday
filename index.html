<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>happy birthday alyssa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=DM+Sans:opsz,wght@9..40,300..600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #fff;
      color: #000;
      font-family: "DM Sans", -apple-system, Helvetica, sans-serif;
      font-weight: 300;
    }

    section {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      transition: opacity 0.6s ease;
    }

    #line {
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(1.25rem, 4vw, 2rem);
      line-height: 1.4;
      max-width: 32ch;
      min-height: 2.8em;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    #line.show {
      opacity: 1;
      transform: translateY(0);
    }

    #line.leave {
      opacity: 0;
      transform: translateY(-8px);
    }

    #next {
      margin-top: 2.5rem;
      background: transparent;
      color: #000;
      border: 1px solid #000;
      padding: 0.6rem 1.6rem;
      font: inherit;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      cursor: pointer;
      transition: background 0.25s ease, color 0.25s ease;
    }

    #next:hover {
      background: #000;
      color: #fff;
    }

    .hidden { display: none; }
    .faded { opacity: 0; }

    /* main site — yoshi collage */
    #backdrop {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 50vh;
      overflow: hidden;
      transition: opacity 0.6s ease;
    }

    #backdrop img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: drift 18s ease-in-out infinite alternate;
    }

    #backdrop img:nth-child(even) { animation-delay: -9s; }

    #backdrop::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(20, 12, 4, 0.35), rgba(20, 12, 4, 0.75));
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }

    @keyframes drift {
      from { transform: scale(1); }
      to { transform: scale(1.12); }
    }

    .page {
      position: relative;
      z-index: 1;
      color: #fff;
    }

    .centerpiece {
      width: clamp(220px, 48vw, 360px);
      aspect-ratio: 1;
      border-radius: 50%;
      object-fit: cover;
      object-position: 50% 45%;
      border: 6px solid #fff;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .page h1 {
      margin-top: 2rem;
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-top: 2.5rem;
    }

    .pill {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 999px;
      font: inherit;
      font-size: 1rem;
      letter-spacing: 0.12em;
      padding: 0.8rem 2.2rem;
      cursor: pointer;
      transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease;
    }

    .pill:hover {
      background: #fff;
      color: #000;
      transform: translateY(-2px);
    }

    .back {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      padding: 0.5rem 1.4rem;
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      #backdrop { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 25vh; }
    }
  </style>
</head>
<body>
  <section id="intro">
    <p id="line"></p>
    <button id="next">next</button>
  </section>

  <div id="backdrop" class="hidden faded" aria-hidden="true">
    <img src="images/img_2433.jpg" alt="">
    <img src="images/img_3117.jpg" alt="">
    <img src="images/img_2426.jpg" alt="">
    <img src="images/img_2440.jpg" alt="">
    <img src="images/img_2421.jpg" alt="">
    <img src="images/img_3116.jpg" alt="">
    <img src="images/img_2423.jpg" alt="">
    <img src="images/img_2422.jpg" alt="">
  </div>

  <section id="site" class="page hidden faded">
    <img class="centerpiece" src="images/img_2980.jpg" alt="yoshi up close">
    <h1>happy birthday, alyssa</h1>
    <div class="buttons">
      <button class="pill" data-go="pictures">pictures</button>
      <button class="pill" data-go="messages">messages</button>
    </div>
  </section>

  <section id="pictures" class="page hidden faded">
    <button class="pill back" data-go="site">&larr; back</button>
    <h1>pictures</h1>
  </section>

  <section id="messages" class="page hidden faded">
    <button class="pill back" data-go="site">&larr; back</button>
    <h1>messages</h1>
  </section>

  <script>
    const lines = [
      "hi alyssa",
      "so i got a bit bored studying for my midterm",
      "and i had some leftover claude tokens",
      "so i thought what better way to spend them",
      "than a vibecoded ai slop website",
      "without further ado",
      "here is my shitty excuse of a birthday card",
    ];

    const intro = document.getElementById("intro");
    const site = document.getElementById("site");
    const line = document.getElementById("line");
    const next = document.getElementById("next");
    const backdrop = document.getElementById("backdrop");

    let i = 0;
    let busy = false;
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

    async function showLine() {
      line.textContent = lines[i];
      line.classList.remove("leave");
      await wait(20);
      line.classList.add("show");
    }

    async function advance() {
      if (busy) return;
      busy = true;

      line.classList.remove("show");
      line.classList.add("leave");
      await wait(400);

      i++;
      if (i < lines.length) {
        await showLine();
        await wait(400);
      } else {
        intro.classList.add("faded");
        await wait(600);
        intro.classList.add("hidden");
        site.classList.remove("hidden");
        backdrop.classList.remove("hidden");
        await wait(20);
        site.classList.remove("faded");
        backdrop.classList.remove("faded");
        document.removeEventListener("keydown", onKey);
      }

      busy = false;
    }

    function onKey(e) {
      if (["Enter", " ", "ArrowRight"].includes(e.key)) {
        e.preventDefault();
        advance();
      }
    }

    let current = site;

    async function go(id) {
      const target = document.getElementById(id);
      if (busy || target === current) return;
      busy = true;
      current.classList.add("faded");
      await wait(600);
      current.classList.add("hidden");
      target.classList.remove("hidden");
      window.scrollTo(0, 0);
      await wait(20);
      target.classList.remove("faded");
      current = target;
      busy = false;
    }

    document.querySelectorAll("[data-go]").forEach((btn) => {
      btn.addEventListener("click", () => go(btn.dataset.go));
    });

    next.addEventListener("click", advance);
    document.addEventListener("keydown", onKey);
    showLine();
  </script>
</body>
</html>
